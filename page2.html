     <!DOCTYPE html>
<html>
  <meta charset = 'utf-8'>
  <head>
    <title> 리스트에서 자료 선택하기 </title>
    <script>
      function drawImage()
      {
        let sel = document.getElementById('fruits');
        let img = document.getElementById('fimg');
        img.src = sel.options[sel.selectedIndex].value;
      }
      function drawImage2()
      {
        let sel = document.getElementById('lunch');
        let img = document.getElementById('fimg2');
        img.src = sel.options[sel.selectedIndex].value;
      }
    </script>
  </head>
  <body>
    주제1. 내가 좋아하는 과일 선택 <br>
    <form>
      <select id = 'fruits' onchange='drawImage()'>
        <option value = 'apple.jpg'> 사과 </option>
        <option value = 'plum.jpg'> 자두 </option>
        <option value = 'orange.jpg'> 오렌지 </option>
      </select>
      <img id = 'fimg' src = 'apple.jpg' alt '설명문' width = 100 height = 100>
    </form>
    <br>
    주제2 오늘 점심 메뉴 선택 <br>
    <form>
      <select id = 'lunch' onchange='drawImage2()'>
        <option value = 'Dumpling.jpg'> 만두국 </option>
        <option value = 'Budae.jpg'> 부대찌개 </option>
        <option value = 'Samgyeop.jpg'> 삼겹살 </option>
        <option value = 'Sujebi.jpg'> 수제비 </option>
        <option value = 'Guksu.jpg'> 막국수 </option>
      </select>
      <img id = 'fimg2' src = 'Dumpling.jpg' alt '설명문' width = 100 height = 100>
    </form>
  </body>
</html>
